<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website</title>
    <span class="border trans" style="font-size: 40px;">
        <centre>Welcome all to this website!</centre>
    </span><br>
    <style>
      .pimg1, .pimg2, .pimg3 {
        position: relative;
        opacity: 0.70;
        background-position: center;
        background-size: cover;
        background-repeat: no-repeat;
        background-attachment:fixed;
      }

      .pimg1 {
        background-image: url("aesthetic\ flower\ 1.jpg");
        min-height: 100%;
      }

      .pimg2 {
        background-image: url("aesthetic\ flower\ 2.jpg");
        min-height: 400px;
      }

      .pimg3 {
        background-image: url("aesthetic\ flower\ 3.jpg");
        min-height: 400px;
      }

      .section {
        text-align: center;
        padding: 50px 80px;
      }

      .section-light {
        background-color: darkslategrey;
        color:aliceblue
      }

      .section-dark {
        background-color:aquamarine;
        color: black;
      }

      .ptext {
        position: absolute;
        top: 50%;
        width: 100%;
        text-align: center;
        color: aliceblue;
        font-size: 27px;
        letter-spacing: 8px;
        text-transform: uppercase;
      }

      .ptext .border {
        background-color: black;
        color: aliceblue;
        padding: 20px;
      }

      .ptext .border .trans {
        background-color: transparent;
      }

      @media(max-width: 568px) {
        .pimg1, .pimg2, .pimg3 {
          background-attachment: scroll;
        }
      }
    </style>
</head>
<body>
    <section class="section section-dark">
        <h2>Section One</h2>
        <p>Web development is the work involved in developing a Web site for the Internet (World Wide Web) or an intranet (a private network).</p>
    </section>
    <div class="pimg3">
        <div class="ptext">
            <span class="border trans">Image Two Text</span>
        </div>
    </div>
</body>
</html>
